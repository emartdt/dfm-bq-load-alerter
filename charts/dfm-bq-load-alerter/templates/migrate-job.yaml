{{- /*
helm pre-upgrade Job — alembic upgrade head 를 새 image 로 1회 실행.

helm hook 순서:
  hook=pre-upgrade,pre-install   → migration 먼저 적용
  hook-weight=-5                 → ServiceAccount/Secret 보다 늦게, 본 deployment 보다 먼저
  hook-delete-policy             → 성공/실패 시 모두 정리 (다음 배포에서 재생성)

failurePolicy=fail 로 두면 hook 실패 시 helm upgrade 가 자동 abort →
스키마 미적용 상태로 deployment 가 새 image 로 갱신되는 위험 회피.

본 Job 은 본 chart 의 deployment 와 같은 image / env / volume 을 쓴다.
DFM_ALERT_POSTGRES_DSN 시크릿 + (선택) BigQuery SA 시크릿이 동일하게
주입돼야 alembic 의 env.py 가 DSN 을 읽고 PG 에 접속 가능.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dfm-bq-load-alerter.fullname" . }}-alembic-{{ .Release.Revision }}
  labels:
    {{- include "dfm-bq-load-alerter.labels" . | nindent 4 }}
    app.kubernetes.io/component: alembic-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "dfm-bq-load-alerter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: alembic-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "dfm-bq-load-alerter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic
          image: {{ include "dfm-bq-load-alerter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DFM_ALERT_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.dsnSecretRef }}
                  key: DFM_ALERT_POSTGRES_DSN
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /*
            settings.py 의 model_validator 가 OIDC + session 필수 변수를
            모듈 import 시점에 검증한다. alembic 은 이 변수를 사용하지
            않지만, 미주입 시 ValidationError 로 Job 자체가 실패한다.
            따라서 deployment 와 동일하게 주입한다.
            */}}
            {{- if .Values.oidc.issuer }}
            - name: DFM_ALERT_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: DFM_ALERT_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- if .Values.oidc.clientSecretRef }}
            - name: DFM_ALERT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef }}
                  key: DFM_ALERT_OIDC_CLIENT_SECRET
            {{- end }}
            {{- end }}
            {{- if .Values.session.secretRef }}
            - name: DFM_ALERT_SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.session.secretRef }}
                  key: DFM_ALERT_SESSION_SECRET_KEY
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
