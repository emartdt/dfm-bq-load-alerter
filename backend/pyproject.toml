[project]
name = "dfm-bq-load-alerter"
version = "0.1.0"
description = "DFM BigQuery 적재 작업 모니터링 및 알림"
requires-python = "~=3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.115",
    "uvicorn[standard]==0.32",
    "pydantic==2.9",
    "pydantic-settings==2.6",
    "sqlalchemy[asyncio]==2.0",
    "asyncpg==0.30",
    "alembic==1.13",
    "apscheduler==3.10",
    "google-cloud-bigquery==3.25",
    "httpx==0.27",
    "python-jose[cryptography]==3.3",
    "python-multipart==0.0.9",
    "jinja2==3.1",
    "cachetools==5.5",
    "cloud-sql-python-connector[asyncpg]==1.12",
    "aiosmtplib==3.0",
    "authlib==1.3",
    "email-validator==2.2",
    "itsdangerous==2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3",
    "pytest-asyncio==0.24",
    "ruff==0.7",
    "mypy==1.13",
    "freezegun==1.5",
    "pytest-postgresql==6.1",
    "pytest-httpx==0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfm_bq_load_alerter"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 Depends/Query/Path/Body 등은 default 인자에 호출이 표준 패턴.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Jinja2 HTML 템플릿 문자열은 가독성 위해 line-length 100 예외 허용
"src/dfm_bq_load_alerter/notifier/template.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
