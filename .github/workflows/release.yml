name: Release

on:
  release:
    types: [published]

env:
  CHART_PATH: charts/dfm-bq-load-alerter
  RELEASE_NAME: dfm-bq-load-alerter
  NAMESPACE: datafabric-alert
  KUBE_CONTEXT: onprem-prd

jobs:
  publish:
    name: Build, push image, helm upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.AR_HOST }}/${{ vars.AR_PROJECT }}/${{ vars.AR_REPO }}/dfm-bq-load-alerter" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl & helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Load kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Ensure namespace
        run: |
          kubectl --context "${KUBE_CONTEXT}" get ns "${NAMESPACE}" \
            || kubectl --context "${KUBE_CONTEXT}" create ns "${NAMESPACE}"

      - name: Helm upgrade
        run: |
          helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
            --kube-context "${KUBE_CONTEXT}" \
            --namespace "${NAMESPACE}" \
            --set image.repository="${{ steps.meta.outputs.image }}" \
            --set image.tag="${{ steps.meta.outputs.tag }}" \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl --context "${KUBE_CONTEXT}" -n "${NAMESPACE}" \
            rollout status deploy/"${RELEASE_NAME}" --timeout=3m
