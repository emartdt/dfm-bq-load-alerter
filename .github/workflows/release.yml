name: Release

on:
  release:
    types: [published]

jobs:
  publish-image:
    name: Build & push image to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.AR_HOST }}/${{ vars.AR_PROJECT }}/${{ vars.AR_REPO }}/dfm-bq-load-alerter" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## 이미지 푸시 완료"
            echo
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:latest\`"
            echo
            echo "### 다음 단계"
            echo "사내망에서 다음 스크립트를 실행해 클러스터에 배포:"
            echo
            echo "\`\`\`bash"
            echo "./scripts/deploy.sh ${{ steps.meta.outputs.tag }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
